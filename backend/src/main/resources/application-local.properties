# ─────────────────────────────────────────────────────────────────────────────
# Local development profile
# Run with:  cd backend && mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# Edit this file directly for your local MySQL password and settings.
# ─────────────────────────────────────────────────────────────────────────────

# ── MySQL ─────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3308}/${DB_NAME:insurance_portal}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
# Set DB_PASSWORD in your shell if your local MySQL user has a password.
spring.datasource.password=${DB_PASSWORD:}

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5000,http://localhost:5173

# ── File uploads ──────────────────────────────────────────────────────────────
app.upload.dir=${FILE_STORAGE_DIR:./uploads}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.insurance=DEBUG
logging.level.org.springframework.security=INFO

# ── Performance tuning for larger local datasets ─────────────────────────────
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
